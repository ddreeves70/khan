<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6270"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">A design is a list of steps; Khan rebuilds them in order</text>

  <!-- Step cards -->
  <g>
    <rect x="24" y="64" width="190" height="88" rx="10" fill="#e7f0fb" stroke="#5c8fdb" stroke-width="1.5"/>
    <text x="40" y="90" font-weight="600" fill="#1f2328">1  Plate</text>
    <text x="40" y="114" fill="#3d4450">box</text>
    <text x="40" y="136" fill="#3d4450">size 60 × 30 × 4 mm</text>
  </g>
  <g>
    <rect x="24" y="166" width="190" height="64" rx="10" fill="#fdf0e4" stroke="#e08a3c" stroke-width="1.5"/>
    <text x="40" y="192" font-weight="600" fill="#1f2328">2  Hole</text>
    <text x="40" y="214" fill="#3d4450">cylinder, radius 2.5 mm</text>
  </g>
  <g>
    <rect x="270" y="110" width="190" height="88" rx="10" fill="#e7f0fb" stroke="#5c8fdb" stroke-width="1.5"/>
    <text x="286" y="136" font-weight="600" fill="#1f2328">3  Tag</text>
    <text x="286" y="160" fill="#3d4450">cut: Plate minus Hole</text>
    <text x="286" y="182" fill="#3d4450">uses steps 1 and 2</text>
  </g>
  <path d="M214 108 H242 V140 H268" fill="none" stroke="#5b6270" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M214 198 H242 V168 H268" fill="none" stroke="#5b6270" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rebuild -->
  <path d="M460 154 H530" fill="none" stroke="#5b6270" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="144" text-anchor="middle" font-size="12.5" fill="#5b6270">rebuild</text>
  <g>
    <rect x="536" y="96" width="200" height="116" rx="10" fill="#f3f4f6" stroke="#9aa1ac" stroke-width="1.5"/>
    <text x="552" y="122" font-weight="600" fill="#1f2328">Finished part</text>
    <!-- a tiny tag drawing -->
    <polygon points="560,176 650,146 712,170 622,200" fill="#5c8fdb" stroke="#2a2f38" stroke-width="1"/>
    <polygon points="560,176 622,200 622,206 560,182" fill="#3e6db3" stroke="#2a2f38" stroke-width="1"/>
    <polygon points="622,200 712,170 712,176 622,206" fill="#335c98" stroke="#2a2f38" stroke-width="1"/>
    <ellipse cx="585" cy="174" rx="7" ry="3.5" fill="#2f4f80" stroke="#2a2f38" stroke-width="1"/>
  </g>
  <text x="24" y="244" font-size="12.5" fill="#5b6270">Change a number in any step and Khan rebuilds everything after it.</text>
</svg>

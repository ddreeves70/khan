name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every public item in src/*/include must have a /// doc comment.
  api-docs:
    name: api-docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Build the API reference
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/docs  # Doxygen does not create parent folders
          doxygen docs/Doxyfile 2>&1 | tee doxygen.log
      - name: Report missing docs
        if: failure()
        shell: bash
        run: |
          head -45 doxygen.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
      - name: Upload the API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: build/docs/html

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    env:
      # Our own vcpkg checkout. VCPKG_ROOT is set from this in the "Get vcpkg" step,
      # after the MSVC step (which points VCPKG_ROOT at Visual Studio's bundled copy).
      KH_VCPKG_DIR: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      # Keep in sync with "builtin-baseline" in vcpkg.json
      VCPKG_COMMIT: 4334d8b4c8916018600212ab4dd4bbdc343065d1

    steps:
      - uses: actions/checkout@v4

      # xvfb and Mesa: the view.gl test draws the 3D view on a virtual screen.
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxi-dev libxext-dev libxmu-dev libxrandr-dev libfontconfig1-dev \
            autoconf autoconf-archive automake libtool pkg-config libxcb1-dev \
            xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install macOS build packages
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      # vcpkg's built packages. Each run on main saves a new copy under its own key,
      # and every run restores the newest one. A fixed key would be found every time,
      # so it was never saved again: once the runner's compiler changed, Windows
      # rebuilt every package (about 80 minutes) on every run.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Get vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg.git "$KH_VCPKG_DIR"
          git -C "$KH_VCPKG_DIR" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "$(cygpath -w "$KH_VCPKG_DIR")\\bootstrap-vcpkg.bat" -disableMetrics
          else
            "$KH_VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$KH_VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" 2>&1 | tee configure.log

      # Right after Configure, which is when vcpkg builds the packages, so the copy
      # is saved even if Khan's own build or tests fail. Only on main: pull requests
      # read main's copy, and saving one per pull request would fill the 10 GB cache.
      - name: Save vcpkg binary cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ci 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # Like a developer's own computer: Qt's plugins must come from next to
          # the programs, not from the Qt install that install-qt-action points to.
          unset QT_PLUGIN_PATH
          ctest --preset ci 2>&1 | tee test.log

      - name: CLI smoke test
        shell: bash
        run: |
          exe=build/ci/apps/kh_cli/kh_cli
          "$exe" --version
          "$exe" demo smoke.step
          test -s smoke.step

      # Turn configure, compiler, linker and test errors into annotations, which can be read
      # without downloading the full log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          cat configure.log build.log test.log 2>/dev/null \
            | grep -E "error|Error|undefined|unresolved external|FAILED:|ld:|cannot find|ld returned|^FAIL |Failed  " \
            | grep -v "^\[" | awk '!seen[$0]++' | head -45 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done

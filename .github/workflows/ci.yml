name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]  # a version tag, like v0.1.0, publishes a release (see "publish")
  pull_request:

jobs:
  # Every public item in src/*/include must have a /// doc comment.
  api-docs:
    name: api-docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Build the API reference
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/docs  # Doxygen does not create parent folders
          doxygen docs/Doxyfile 2>&1 | tee doxygen.log
      - name: Report missing docs
        if: failure()
        shell: bash
        run: |
          head -45 doxygen.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
      - name: Upload the API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: build/docs/html

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 runners are retired on 2026-11-02 (actions/runner-images#13518).
        os: [ubuntu-24.04, windows-2022, macos-15]

    env:
      # Our own vcpkg checkout. VCPKG_ROOT is set from this in the "Get vcpkg" step,
      # after the MSVC step (which points VCPKG_ROOT at Visual Studio's bundled copy).
      SB_VCPKG_DIR: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      # Keep in sync with "builtin-baseline" in vcpkg.json
      VCPKG_COMMIT: 4334d8b4c8916018600212ab4dd4bbdc343065d1

    steps:
      - uses: actions/checkout@v4

      # xvfb and Mesa: the view.gl test draws the 3D view on a virtual screen.
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxi-dev libxext-dev libxmu-dev libxrandr-dev libfontconfig1-dev \
            autoconf autoconf-archive automake libtool pkg-config libxcb1-dev \
            xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install macOS build packages
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      # vcpkg's built packages. Each run on main saves a new copy under its own key,
      # and every run restores the newest one. A fixed key would be found every time,
      # so it was never saved again: once the runner's compiler changed, Windows
      # rebuilt every package (about 80 minutes) on every run.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Get vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg.git "$SB_VCPKG_DIR"
          git -C "$SB_VCPKG_DIR" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "$(cygpath -w "$SB_VCPKG_DIR")\\bootstrap-vcpkg.bat" -disableMetrics
          else
            "$SB_VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$SB_VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" 2>&1 | tee configure.log

      # Right after Configure, which is when vcpkg builds the packages, so the copy
      # is saved even if SketchBillet's own build or tests fail. Only on main: pull requests
      # read main's copy, and saving one per pull request would fill the 10 GB cache.
      - name: Save vcpkg binary cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ci 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # Like a developer's own computer: Qt's plugins must come from next to
          # the programs, not from the Qt install that install-qt-action points to.
          unset QT_PLUGIN_PATH
          ctest --preset ci 2>&1 | tee test.log

      - name: CLI smoke test
        shell: bash
        run: |
          exe=build/ci/apps/sketchbillet_cli/sketchbillet_cli
          "$exe" --version
          "$exe" demo smoke.step
          test -s smoke.step

      # ---- Installers (packaging/README.md). Made on every run, so a pull request
      # that breaks one is caught; published by the "publish" job below.
      - name: Install WiX (Windows installer tools)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Make the installer
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            QMAKE="$QT_ROOT_DIR/bin/qmake" packaging/linux/make-appimage.sh build/ci 2>&1 | tee package.log
          else
            cpack --config build/ci/CPackConfig.cmake 2>&1 | tee package.log
          fi
          ls -l build/ci/packages

      # Install what people download, and run it from where it was installed: a
      # missing library shows up here, not on a student's computer.
      - name: Test the installer
        shell: bash
        run: |
          set -euo pipefail
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH
          out="$RUNNER_TEMP/installed-test"
          mkdir -p "$out"
          case "$RUNNER_OS" in
            Linux)
              pkg=$(ls build/ci/packages/*.AppImage)
              export APPIMAGE_EXTRACT_AND_RUN=1
              "$pkg" cli --version
              "$pkg" cli demo "$out/demo.step" && test -s "$out/demo.step"
              xvfb-run -a "$pkg" --smoke-test --settings "$out/settings.ini"
              ;;
            Windows)
              pkg=$(cygpath -w "$(ls build/ci/packages/*.msi)")
              # Quietly, for every user, as a school's IT department would.
              powershell -Command "\$p = Start-Process msiexec -ArgumentList '/i','\"$pkg\"','/qn','/l*v','msi-install.log' -Wait -PassThru; exit \$p.ExitCode"
              dir="/c/Program Files/SketchBillet/bin"
              "$dir/sketchbillet_cli.exe" --version
              "$dir/sketchbillet_cli.exe" demo "$out/demo.step" && test -s "$out/demo.step"
              "$dir/sketchbillet.exe" --smoke-test --settings "$out/settings.ini"
              test -f "/c/ProgramData/Microsoft/Windows/Start Menu/Programs/SketchBillet.lnk"
              powershell -Command "\$p = Start-Process msiexec -ArgumentList '/x','\"$pkg\"','/qn' -Wait -PassThru; exit \$p.ExitCode"
              test ! -e "$dir/sketchbillet.exe"
              ;;
            macOS)
              pkg=$(ls build/ci/packages/*.dmg)
              hdiutil attach "$pkg" -nobrowse -mountpoint "$out/dmg"
              app="$out/dmg/SketchBillet.app"
              codesign --verify --deep --strict "$app"
              "$app/Contents/MacOS/sketchbillet_cli" --version
              "$app/Contents/MacOS/sketchbillet_cli" demo "$out/demo.step" && test -s "$out/demo.step"
              "$app/Contents/MacOS/sketchbillet" --smoke-test --settings "$out/settings.ini"
              hdiutil detach "$out/dmg"
              ;;
          esac

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            build/ci/packages/*.msi
            build/ci/packages/*.dmg
            build/ci/packages/*.AppImage
          if-no-files-found: error

      # Turn configure, compiler, linker and test errors into annotations, which can be read
      # without downloading the full log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          cat configure.log build.log test.log package.log msi-install.log 2>/dev/null \
            | grep -E "error|Error|undefined|unresolved external|FAILED:|ld:|cannot find|ld returned|^FAIL |Failed  " \
            | grep -v "^\[" | awk '!seen[$0]++' | head -45 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done

  # Puts the installers where the Download page (sketchbillet.org/download/) finds them:
  #   a version tag, like v0.1.0  ->  the release "SketchBillet 0.1.0"
  #   every push to main          ->  the "preview" pre-release, replaced each time
  # then rebuilds the website, so the page shows the new files.
  publish:
    name: publish installers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # releases and the preview tag
      actions: write   # start the website build
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          cd installers
          ls -l
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' ../CMakeLists.txt | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::The tag $tag doesn't match SketchBillet's version, $version (project VERSION in CMakeLists.txt). Change one so they match, then tag again."
              exit 1
            fi
            gh release create "$tag" ./* --verify-tag --title "SketchBillet $version" --generate-notes
          else
            # Same names every time (SketchBillet-preview-windows-x64.msi, ...), so links stay put.
            for f in SketchBillet-*; do mv "$f" "${f/SketchBillet-$version-/SketchBillet-preview-}"; done
            notes="Built from $(git rev-parse --short HEAD) on $(date -u '+%b %-d, %Y'), version $version plus everything merged since. Preview builds have the newest features and may have new bugs. For lessons and real work, use the latest release."
            git tag -f preview "$GITHUB_SHA"
            git push -f origin refs/tags/preview
            if gh release view preview >/dev/null 2>&1; then
              gh release edit preview --prerelease --title "Preview build" --notes "$notes"
            else
              gh release create preview --prerelease --verify-tag --title "Preview build" --notes "$notes"
            fi
            gh release upload preview ./* --clobber
          fi
      - name: Update the website
        run: gh workflow run website.yml --ref main
